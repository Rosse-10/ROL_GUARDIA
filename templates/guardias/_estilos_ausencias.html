<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #112233, #1e3c72);
        color: white;
        margin: 0;
        padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }

    .header {
        text-align: center;
        padding: 20px 0;
        border-bottom: 2px solid #ffc107;
        margin-bottom: 25px;
        position: relative;
    }
    .header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; }
    .header p { margin: 5px 0 0 0; color: #ffc107; font-size: 1.1rem; }

    .back-btn {
        position: absolute;
        left: 0;
        top: 25px;
        background: #6c757d;
        color: white;
        text-decoration: none;
        padding: 8px 15px;
        border-radius: 5px;
        font-weight: bold;
        font-size: 0.9rem;
    }
    .back-btn:hover { background: #5a6268; }

    .card {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 25px;
        margin-bottom: 25px;
        border: 1px solid rgba(255,193,7,0.3);
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .card h3 { margin-top: 0; color: #ffc107; margin-bottom: 20px; }

    .form-label { font-weight: bold; color: #ffc107; display: block; margin-bottom: 5px; }
    .form-control, .form-select {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid rgba(255,255,255,0.3);
        background: rgba(0,0,0,0.3);
        color: white;
        box-sizing: border-box;
        margin-bottom: 15px;
        font-family: inherit;
        font-size: 0.95rem;
        color-scheme: dark;
    }
    .form-select optgroup { color: #ffc107; background: #112233; }
    .form-select option { color: white; background: #1e3c72; }
    .campo-error .form-control, .campo-error .form-select { border-color: #dc3545; }
    .error-text { color: #ff6b7a; font-size: 0.85rem; margin: -10px 0 12px 0; font-weight: bold; }
    .ayuda { font-size: 0.8rem; opacity: 0.7; margin: -10px 0 12px 0; }

    .row { display: flex; gap: 15px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 200px; }

    .btn-submit {
        background: #ffc107;
        color: #112233;
        border: none;
        padding: 12px 20px;
        font-weight: bold;
        font-size: 1rem;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s;
    }
    .btn-submit:hover { background: #e0a800; }
    .btn-aprobar, .btn-rechazar {
        border: none;
        color: white;
        padding: 9px 16px;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
    }
    .btn-aprobar { background: #28a745; }
    .btn-aprobar:hover { background: #218838; }
    .btn-rechazar { background: #dc3545; }
    .btn-rechazar:hover { background: #bd2130; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); vertical-align: top; }
    th { color: #ffc107; background: rgba(0,0,0,0.4); font-size: 0.9rem; text-transform: uppercase; }
    tr:hover { background: rgba(255,255,255,0.05); }

    .badge { background: #17a2b8; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
    .badge-pendiente { background: #ffc107; color: #112233; }
    .badge-aprobada { background: #28a745; }
    .badge-rechazada { background: #dc3545; }

    .alert { padding: 12px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }
    .alert-success { background: rgba(40, 167, 69, 0.3); border: 1px solid #28a745; color: #5dd879; }
    .alert-danger { background: rgba(220, 53, 69, 0.3); border: 1px solid #dc3545; color: #ff6b7a; }
    .alert-warning { background: rgba(255, 193, 7, 0.2); border: 1px solid #ffc107; color: #ffc107; }

    .link-archivo { color: #6ec1ff; font-weight: bold; text-decoration: none; }
    .link-archivo:hover { text-decoration: underline; }
    .miniatura {
        max-width: 160px;
        max-height: 120px;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.3);
        display: block;
        margin-bottom: 6px;
    }
    .vacio { text-align: center; opacity: 0.6; padding: 25px; }
    .detalle-secundario { font-size: 0.85rem; opacity: 0.75; }

    details.card > summary { cursor: pointer; color: #ffc107; font-weight: bold; font-size: 1.15rem; }
    details.card[open] > summary { margin-bottom: 20px; }

    @media (max-width: 700px) {
        .header h1 { font-size: 1.4rem; }
        .back-btn { position: static; display: inline-block; margin-bottom: 10px; }
        .card { padding: 16px; }
    }
</style>
