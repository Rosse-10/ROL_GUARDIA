<!DOCTYPE html>
<html>
<head>
    <title>{{ titulo }} - EMI</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 35px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-bottom: 25px; color: #ffc107; font-size: 1.8rem; }
        
        /* Estilos para los campos del formulario de Django */
        form p {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        input[type="checkbox"] {
            transform: scale(1.2);
            margin-right: 8px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ffc107;
        }
        
        .btn-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }
        .btn {
            padding: 12px 25px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }
        .btn-save { background-color: #28a745; }
        .btn-save:hover { background-color: #218838; }
        
        .btn-back { background-color: #6c757d; }
        .btn-back:hover { background-color: #5a6268; }

        /* Mensajes de error del formulario si los hubiera */
        .errorlist {
            color: #ff6b6b;
            list-style: none;
            padding: 0;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 {{ titulo }}</h1>

    <form method="POST">
        {% csrf_token %}
        
        {{ form.as_p }}

        <div class="btn-container">
            <a href="{% url 'lista_gestiones' %}" class="btn btn-back">⬅️ Cancelar</a>
            <button type="submit" class="btn btn-save">💾 Guardar Gestión</button>
        </div>
    </form>
</div>

</body>
</html>
