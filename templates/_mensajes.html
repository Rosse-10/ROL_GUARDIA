{% if messages %}
<style>
    .avisos { margin: 15px 0; }
    .aviso { padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; font-weight: bold; color: #fff; }
    .aviso-success { background: #28a745; }
    .aviso-error { background: #dc3545; }
    .aviso-warning { background: #e0a800; color: #222; }
    .aviso-info { background: #17a2b8; }
</style>
<div class="avisos">
    {% for message in messages %}
        <div class="aviso aviso-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}
