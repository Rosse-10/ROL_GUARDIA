<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Estudiantes - EMI</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: white;
            padding: 40px 20px;
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            width: 95%;
            max-width: 1100px;
        }

        h1 { 
            font-size: 32px; 
            margin-bottom: 30px; 
            border-bottom: 2px solid rgba(78, 205, 196, 0.3); 
            padding-bottom: 15px;
            letter-spacing: 1px;
        }

        .grid-estudiantes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card-estudiante {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: left;
            transition: transform 0.3s, background 0.3s;
        }

        .card-estudiante:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.2);
        }

        .nombre {
            font-weight: bold;
            color: #4ecdc4;
            font-size: 20px;
            display: block;
            margin-bottom: 8px;
        }

        .info {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .acciones {
            display: flex;
            gap: 20px;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 15px;
            margin-top: 15px;
        }

        .btn-edit {
            text-decoration: none;
            font-size: 14px;
            color: #ffca28;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ff5252;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            transition: 0.2s;
        }

        .btn-edit:hover, .btn-delete:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }

        .btn-volver {
            margin-top: 50px;
            padding: 12px 35px;
            background: white;
            color: #764ba2;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-volver:hover { 
            transform: scale(1.05); 
            background: #f0f0f0; 
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 50px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            border: 2px dashed rgba(255,255,255,0.1);
            font-style: italic;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>👨‍✈️ Registro Global de Estudiantes - EMI</h1>
        
        <div class="grid-estudiantes">
            {% for est in estudiantes %}
                <div class="card-estudiante">
                    <span class="nombre">{{ est.apellido }}, {{ est.nombre }}</span>
                    <div class="info">
                        📍 <strong>{{ est.anio }}° Año</strong><br>
                        🎓 Escuela Militar de Ingeniería
                    </div>

                    <div class="acciones">
                        <a href="{% url 'editar_estudiante' est.id %}" class="btn-edit">
                            ✏️ Editar
                        </a>
                        
                        <form action="{% url 'eliminar_estudiante' est.id %}" method="POST" onsubmit="return confirm('¿Seguro que deseas eliminar a {{ est.nombre }}?')">
                            {% csrf_token %}
                            <button type="submit" class="btn-delete">
                                🗑️ Eliminar
                            </button>
                        </form>
                    </div>
                </div>
            {% empty %}
                <div class="empty-state">
                    <p>No hay estudiantes registrados en la base de datos.</p>
                </div>
            {% endfor %}
        </div>

        <a href="javascript:window.close();" class="btn-volver">❌ Cerrar Registro</a>
    </div>

</body>
</html>
