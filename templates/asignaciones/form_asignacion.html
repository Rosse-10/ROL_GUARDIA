{% extends 'home.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 shadow-lg" style="width: 100%; max-width: 500px; border-radius: 20px;">
        <h2 class="text-center mb-4">{{ titulo }}</h2>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success" style="border-radius: 10px;">Guardar Asignación</button>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary" style="border-radius: 10px;">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
