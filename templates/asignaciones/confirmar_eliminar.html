{% extends 'home.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 border-danger shadow" style="max-width: 400px; border-radius: 20px;">
        <h3 class="text-danger text-center">¿Eliminar asignación?</h3>
        <p class="text-center">Esta acción no se puede deshacer.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-danger" style="border-radius: 10px;">Sí, Eliminar</button>
                <a href="{% url 'home' %}" class="btn btn-light" style="border-radius: 10px;">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
