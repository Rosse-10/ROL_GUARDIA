<!DOCTYPE html>
<html>
<head>
    <title>{{ titulo }} - EMI</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 400px;
        }
        h2 { text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-control, .form-select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.2);
            color: white;
            box-sizing: border-box;
        }
        .form-select option { background: #1e3c72; color: white; }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #28a745;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #218838; }
        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #ffc107;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>{{ titulo }}</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
   <button type="submit" class="btn-submit">💾 Guardar Registro</button>
        
        <!-- Botón de Atrás agregado -->
        <a href="{% url 'lista_estudiantes' %}" style="display: block; text-align: center; margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
            ⬅️ Atrás (Volver a la Lista)
        </a>

        <a href="{% url 'lista_estudiantes' %}" class="btn-cancel">❌ Cancelar</a>
    </form>
</div>

</body>
</html>
