<!DOCTYPE html>
<html>
<head>
    <title>Elimiar Estudiante</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
            width: 450px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚠️ ¿Confirmar Baja de Estudiante?</h2>
    <p>Está a punto de remover del sistema al estudiante:</p>
    <h3 style="color: #ffc107;">{{ estudiante.apellido }}, {{ estudiante.nombre }}</h3>
    <p style="font-size: 14px; opacity: 0.8;">Esta acción quitará al alumno de las futuras asignaciones secuenciales de guardia.</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🔴 Confirmar Eliminar</button>
        <a href="{% url 'lista_estudiantes' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
